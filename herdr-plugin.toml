id = "kichel.muster"
name = "Muster"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Agent-aware project switcher — muster your projects into workspaces"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "picker"
title = "Muster"
placement = "zoomed"
command = ["./target/release/herdr-muster"]

[[panes]]
id = "jump-pane"
title = "Jump Pane"
placement = "zoomed"
command = ["./target/release/herdr-muster", "--jump-pane"]

[[actions]]
id = "open"
title = "Muster: pick project"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "kichel.muster", "--entrypoint", "picker"]

[[actions]]
id = "jump-pane"
title = "Muster: Jump Pane"
contexts = ["workspace", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "kichel.muster", "--entrypoint", "jump-pane"]
